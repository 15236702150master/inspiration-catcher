server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inspiration.zzhhh.site;

    ssl_certificate /etc/letsencrypt/live/inspiration.zzhhh.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inspiration.zzhhh.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/worker/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Inspiration-Gateway authenticated;
        client_max_body_size 2m;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name inspiration.zzhhh.site;
    return 301 https://$host$request_uri;
}
